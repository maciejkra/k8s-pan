# Dwa namespace żeby pokazać różnicę:
# - baseline: nginx root przechodzi (baseline pozwala na root)
# - restricted: nginx root ZABLOKOWANY → negative test, kluczowa lekcja PSA
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-baseline
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-restricted
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
