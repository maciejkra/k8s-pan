# Deployment który PRZEJDZIE przez VAP w namespace maciek.
# Wszystkie wymagania:
# - runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation=false
# - requests cpu + memory
# - NIE ustawiać limits.cpu (burst OK)
# - limits.memory == requests.memory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-app
  namespace: maciek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-app
  template:
    metadata:
      labels:
        app: good-app
    spec:
      containers:
      - name: myapp
        image: nginxinc/nginx-unprivileged:1.27-alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 128Mi         # == requests.memory
            # cpu: limit BRAK — VAP nie pozwala
        ports:
        - containerPort: 8080
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: cache
            mountPath: /var/cache/nginx
          - name: run
            mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
