# Mutation: auto-dodaje label `owner=unknown` jeśli Pod go nie ma.
# Pokazuje DRUGĄ stronę Gatekeeper: nie tylko "reject", ale też "fix automatically".
#
# Wymaga przy install Gatekeeper:
#   helm install ... --set enableMutation=true
#
# AssignMetadata z założenia NIE nadpisuje istniejących labeli — to wbudowane
# zachowanie (od Gatekeeper 3.7+), bez `pathTests`. Dla pól innych niż metadata
# (np. spec.containers...) używaj `Assign` z explicit `pathTests`.
apiVersion: mutations.gatekeeper.sh/v1
kind: AssignMetadata
metadata:
  name: set-default-owner-label
spec:
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  location: "metadata.labels.owner"
  parameters:
    assign:
      value: "unknown"
