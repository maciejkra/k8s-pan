apiVersion: v1
kind: Pod
metadata:
  name: pod-hardened
  labels:
    security: hardened
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080    # unprivileged port — nie wymaga NET_BIND_SERVICE
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
    - name: nginx-cache
      emptyDir:
        medium: Memory
    - name: nginx-run
      emptyDir:
        medium: Memory
