injector:
  replicas: 1
  agentDefaults:
    cpuLimit: "500m"
    cpuRequest: "50m"

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

  affinity: null

server:
  updateStrategyType: "OnDelete"
  affinity: null
  # dataStorage OFF — dev mode jest zawsze in-memory, persistence się kłóci.
  # Dla produkcji: wyłącz dev.enabled, włącz dataStorage + raft storage backend.
  dataStorage:
    enabled: false
  dev:
    enabled: true
    devRootToken: "root"

ui:
  enabled: true
  publishNotReadyAddresses: true

csi:
  # secrets-store-csi-driver-provider-vault daemonset.
  # Wymaga secrets-store-csi-driver zainstalowanego osobno (patrz task.md).
  enabled: true
