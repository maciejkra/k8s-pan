<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; padding: 0; }
body { width: 720pt; height: 405pt; background: #0F172A; font-family: Arial, Helvetica, sans-serif; display: flex; }
.left { width: 470pt; height: 405pt; padding: 60pt 50pt; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
.right { width: 250pt; height: 405pt; background: #1E293B; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40pt; box-sizing: border-box; }
.brand { color: #60A5FA; font-size: 11pt; font-weight: bold; letter-spacing: 4pt; margin: 0; }
.accent { width: 80pt; height: 4pt; background: #DC2626; margin-bottom: 18pt; }
.title { color: #FFFFFF; font-size: 50pt; font-weight: bold; margin: 0; line-height: 1.05; }
.subtitle { color: #94A3B8; font-size: 22pt; margin: 12pt 0 0 0; }
.author { color: #CBD5E1; font-size: 12pt; margin: 0; }
img.logo { display: block; margin: 14pt 0; }
.lockicon { font-size: 110pt; color: #DC2626; margin: 8pt 0; }
</style>
</head>
<body>
<div class="left">
  <p class="brand">JSYSTEMS · DEVOPS TRAINING · 2026</p>
  <div>
    <div class="accent"></div>
    <h1 class="title">Security — pełen stack</h1>
    <p class="subtitle">Dzień 4</p>
  </div>
  <p class="author">Maciej Krajewski · jsystems.pl</p>
</div>
<div class="right">
  <p class="lockicon">🔒</p>
  <img class="logo" src="cosign.png" style="width: 120pt; height: auto;">
</div>
</body>
</html>
