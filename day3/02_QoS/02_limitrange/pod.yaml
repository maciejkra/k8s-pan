# Ten Pod ma TYLKO limits.memory (bez requests, bez cpu) — celowo "niekompletny".
# LimitRange wstrzyknie:
#  - defaultRequest.cpu: 500m (requests)
#  - default.cpu: 500m (limits, bo brak)
#  - requests.memory = limits.memory (bo request brak)
# Wynik: Pod dostanie pełen profil CPU + memory, QoS = Burstable (requests<limits bo CPU dopasowane, memory tylko limit).
apiVersion: v1
kind: Pod
metadata:
  name: myapp-limitrange
  labels:
    name: myapp
spec:
  containers:
  - name: myapp
    image: nginx:1.27-alpine
    resources:
      limits:
        memory: 128Mi
        # cpu celowo BRAK — LimitRange wstrzyknie default
    ports:
      - containerPort: 80
