# Deployment BEZ explicit resources — LimitRange wstrzyknie defaulty (requests i limits).
# Quota NS pozwoli na replicas=10 × 200m CPU limit = 2 CPU (dokładnie limits.cpu quota).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: test-1
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        # celowo bez resources: {} — LimitRange dorzuci defaulty
