# Dwa Pody do testów NetworkPolicy — `client` i `server`.
# Klient ma label app=busybox, serwer app=server.
# Tworzone w NS default żeby sharować z innymi ćwiczeniami.
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  labels:
    app: server
    tier: backend
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: busybox
    tier: frontend
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 20Mi }
