# Deny all egress dla Pod-ów z labelem app=busybox.
# Użyte razem z test-pods.yaml: klient (busybox) nie będzie mógł się łączyć nigdzie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: busybox-deny-egress
spec:
  podSelector:
    matchLabels:
      app: busybox
  policyTypes:
  - Egress
  egress: []    # pusta lista = blokuj wszystko
