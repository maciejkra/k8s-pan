# Wersja v2 ("nowa" — canary, 30% ruchu).
# Obraz pkad:green — strona zwraca "green"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app-v2
  labels:
    app: canary-app
    version: v2
spec:
  replicas: 1   # celowo mniej niż v1 — w prawdziwym canary nie trzeba skalować proporcjonalnie do weight
  selector:
    matchLabels:
      app: canary-app
      version: v2
  template:
    metadata:
      labels:
        app: canary-app
        version: v2
    spec:
      containers:
      - name: pkad
        image: poznajkubernetes/pkad:green
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: canary-app-v2
spec:
  selector:
    app: canary-app
    version: v2
  ports:
  - port: 80
    targetPort: 8080
    name: http
