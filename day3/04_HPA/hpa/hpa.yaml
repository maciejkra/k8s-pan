apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  # Behavior — świadoma kontrola tempa skalowania.
  # Domyślnie: scale-up natychmiast, scale-down z 5min stabilizationWindow (chroni przed flappingiem).
  # Tu: agresywny scale-up (burst), konserwatywny scale-down (60s window).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   # skaluj w górę natychmiast (bez histerezy)
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30           # max +100% replik co 30s
        - type: Pods
          value: 4
          periodSeconds: 30           # ... albo +4 Pody co 30s
      selectPolicy: Max               # wybierz większą z powyższych
    scaleDown:
      stabilizationWindowSeconds: 60  # scale-down dopiero jeśli metryki spadają ≥60s
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60           # max -50% replik co 60s
