apiVersion: apps/v1
kind: Deployment
metadata:
  name: risky-svc                # bez PDB — drain może zabić wszystkie repliki naraz
spec:
  replicas: 4
  selector:
    matchLabels:
      app: risky-svc
  template:
    metadata:
      labels:
        app: risky-svc
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
