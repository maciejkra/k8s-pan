apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  labels:
    app: gpu-test
spec:
  containers:
    - name: cuda
      image: ubuntu:22.04
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 1            # requests jest implicit = limits dla extended resources
  # W produkcji typowo dodaje się:
  # nodeSelector:
  #   nvidia.com/gpu.product: Tesla-A100
  # tolerations:
  #   - key: nvidia.com/gpu
  #     operator: Exists
  #     effect: NoSchedule
