# ServiceMonitor CRD — instruuje Prometheus Operator żeby scrape'ował metryki z Service.
# Matching po labelach Service (selector) + endpoint config (port, path, interval).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-service-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # matchuje serviceMonitorSelector Prometheus Operator
    project: python
spec:
  # Matchuje Service z D1/10 (python app). Label dodany przez helm chart albo ręcznie.
  selector:
    matchLabels:
      app: python           # D1/10 ma label app: python
  namespaceSelector:
    any: true               # scrape ze wszystkich NS; w produkcji lepiej lista: [prod, staging]
  endpoints:
  - port: api               # nazwa portu ze Service (NIE numer!) — D1/10 ma port 5002 named 'api'
    interval: 30s
    path: /metrics
