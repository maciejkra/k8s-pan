# kube-vip JAKO STATIC POD (rekomendowana metoda dla kubeadm w 2026).
#
# Umieść plik w /etc/kubernetes/manifests/kube-vip.yaml PRZED `kubeadm init`.
# kubelet automatycznie podniesie static pod przy starcie — kube-vip zacznie programować VIP
# zanim apiserver w ogóle wstanie.
#
# PAMIĘTAJ:
# 1. Edytuj `vip_interface` i `address` wg swojego środowiska (env VIP_IF, VIP_IP).
# 2. Skopiuj ten plik na KAŻDY CP node PRZED `kubeadm join --control-plane`
#    (kubeadm join NIE kopiuje static pod manifestów!)
# 3. Dla Cilium kube-proxy-replacement pomiń wcześniej `kubectl apply rbac.yaml` — kube-vip
#    jako static pod nie potrzebuje RBAC (używa kubeconfig z node).
apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  name: kube-vip
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: kube-vip
      image: ghcr.io/kube-vip/kube-vip:v1.1.2      # stable
      imagePullPolicy: IfNotPresent
      args:
        - manager
      env:
        - name: vip_arp
          value: "true"
        - name: port
          value: "6443"
        - name: vip_nodename
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: vip_interface
          value: eth1                               # ZMIEŃ na swój interface (np. eth0, ens3)
        - name: vip_subnet
          value: "32"
        - name: dns_mode
          value: first
        - name: cp_enable
          value: "true"
        - name: cp_namespace
          value: kube-system
        - name: svc_enable
          value: "false"                            # tylko CP; Services przez MetalLB / Cilium
        - name: vip_leaderelection
          value: "true"
        - name: vip_leasename
          value: plndr-cp-lock
        - name: vip_leaseduration
          value: "5"
        - name: vip_renewdeadline
          value: "3"
        - name: vip_retryperiod
          value: "1"
        - name: address
          value: 10.135.0.100                       # ZMIEŃ na swój VIP IP (kubeapi.example.com)
        - name: prometheus_server
          value: :2112
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
          drop:
            - ALL
      resources: {}
      volumeMounts:
        - mountPath: /etc/kubernetes/admin.conf
          name: kubeconfig
  volumes:
    - name: kubeconfig
      hostPath:
        path: /etc/kubernetes/admin.conf
        # type: File (NIE FileOrCreate) — pod nie wstaje aż admin.conf realnie istnieje.
        # FileOrCreate stworzyłby pusty plik gdy kubelet odpala pod przed kubeadm init/join,
        # kube-vip wczytałby pusty kubeconfig → fallback do hostname `kubernetes` → DNS fail.
        type: File
