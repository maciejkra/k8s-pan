apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              # Wygeneruj swój klucz: head -c 32 /dev/urandom | base64
              # NIE używaj tej wartości w produkcji — zastąp własną.
              secret: REPLACE_ME_BASE64_32B
      - identity: {}
