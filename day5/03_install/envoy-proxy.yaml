# EnvoyProxy + GatewayClass override dla DigitalOcean setupu z 03_install.
#
# Problem: domyślnie Envoy Gateway tworzy data plane jako Deployment z Service
# typu LoadBalancer. W kubeadm na DO bez cloud-controller-managera Service
# LoadBalancer zostaje w stanie EXTERNAL-IP=<pending> — DO LB control_plane_lb
# (z terraform/main.tf) forwarduje 80/443 → CP nodes, więc data plane MUSI być
# na CP nodes i bind hostport 80/443.
#
# Rozwiązanie: EnvoyProxy CR z DaemonSet (po jednym Pod na każdy CP),
# hostNetwork=true (bind na host:80/host:443), tolerations + nodeSelector
# żeby schedulować TYLKO na CP. GatewayClass `eg` dostaje parametersRef do
# tego EnvoyProxy — wszystkie Gateway resources używające `gatewayClassName: eg`
# automatycznie dostają tę konfigurację data plane.
#
# Apply po `helm install eg oci://docker.io/envoyproxy/gateway-helm` (Część 8).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: control-plane-envoy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # DaemonSet zamiast Deployment — jeden Pod per CP node.
      envoyDaemonSet:
        pod:
          # bind na host port 80/443 (DO LB forwarduje tutaj).
          hostNetwork: true
          # Pozwala schedulować na CP mimo NoSchedule taintu kubeadm.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Wymusza schedule TYLKO na CP — worker nie dostaje Pod'a.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
      # Service ClusterIP — używamy hostNetwork, external IP nieistotny
      # (ruch wchodzi przez DO LB → CP host:80/443 bezpośrednio).
      envoyService:
        type: ClusterIP
---
# Override default GatewayClass `eg` (z day2/07_gateway_api/gateway-http.yaml).
# Dodajemy parametersRef żeby Envoy Gateway controller użył naszej EnvoyProxy
# (DaemonSet/hostNetwork/CP) zamiast default Deployment+LoadBalancer.
#
# UWAGA: Jeśli w sesji D2/07 zaapliujesz `kubectl apply -f gateway-http.yaml`,
# ten plik NADPISZE GatewayClass `eg` bez parametersRef. Wtedy re-apply tego
# pliku: `kubectl apply -f envoy-proxy.yaml` — przywraca parametersRef.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: control-plane-envoy
    namespace: envoy-gateway-system
