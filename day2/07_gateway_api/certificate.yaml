apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
spec:
  secretName: app-tls          # cert-manager utworzy ten Secret
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - app.example.com           # ZMIEŃ na swoją domenę
  duration: 2160h               # 90 dni
  renewBefore: 360h             # odnowienie 15 dni przed wygaśnięciem
